server:
  port: ${SERVER_PORT:8080}

vaadin:
  productionMode: ${VAADIN_PRODUCTIONMODE:true}

spring:
  application:
    name: crm-platform
  sql:
    init:
      mode: always
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:rootpassword}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CrmHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: cs-crm-2026
    expiration-ms: 3600000
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

crm:
  frontend:
    api-base-url: ${CRM_API_BASE_URL:http://localhost:${server.port:8080}}
  delivery:
    provider: ${CRM_DELIVERY_PROVIDER:simulated}
  async:
    stream-key: ${CRM_STREAM_KEY:crm:campaign:deliveries:stream}
    consumer-group: ${CRM_CONSUMER_GROUP:crm:delivery:workers}
    batch-size: 20
    poll-timeout-ms: 2000
    worker-threads: 4
    max-stream-length: ${CRM_MAX_STREAM_LENGTH:10000}
    outbox-poll-interval-ms: ${CRM_OUTBOX_POLL_INTERVAL_MS:2000}
    pel-recovery-interval-ms: ${CRM_PEL_RECOVERY_INTERVAL_MS:15000}
  pagination:
    default-size: 20
    max-size: 100
  upload:
    max-response-errors: 100
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:7000}

smtp:
  host: ${SPRING_MAIL_HOST:${SMTP_HOST:localhost}}
  port: ${SPRING_MAIL_PORT:${SMTP_PORT:1025}}
  username: ${SPRING_MAIL_USERNAME:${SMTP_USERNAME:}}
  password: ${SPRING_MAIL_PASSWORD:${SMTP_PASSWORD:}}
  from: ${SMTP_FROM:noreply@crm.internal}
  timeout-ms: ${SMTP_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

